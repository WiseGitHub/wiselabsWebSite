<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>·</title>
<style>
  :root{--h:188;--ink:#dfe9f5;--dim:#7d90ab;--accent:hsl(188,90%,60%)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#04070d}
  body{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;color:var(--ink)}
  #scene{position:fixed;inset:0;display:block}
  .ov{position:fixed;inset:0;pointer-events:none}
  .scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.5}
  .vig{background:radial-gradient(120% 100% at 50% 42%,transparent 42%,rgba(0,0,0,.5) 100%)}
  .empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    text-align:center;color:var(--dim);cursor:pointer}
  .empty b{color:var(--ink);font-weight:500;letter-spacing:.06em}
  .empty .big{font-size:14px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);
    text-shadow:0 0 18px var(--accent);margin-bottom:6px}
  .empty small{font-size:11px;letter-spacing:.1em}
  #pick{display:none}
  .hud{position:fixed;left:24px;bottom:22px;display:flex;flex-direction:column;gap:11px;
    padding:15px 16px;background:rgba(8,14,22,.62);border:1px solid rgba(120,220,255,.16);
    border-radius:10px;backdrop-filter:blur(3px);font-size:11px;min-width:270px}
  .hud.hidden{display:none}
  .now{display:flex;justify-content:space-between;align-items:center;letter-spacing:.12em;text-transform:uppercase}
  .now .val{color:var(--accent);text-shadow:0 0 10px var(--accent)}
  .stopbtn{font:inherit;font-size:10px;background:transparent;border:1px solid rgba(120,220,255,.22);
    color:var(--dim);border-radius:6px;padding:4px 9px;cursor:pointer;text-transform:uppercase;letter-spacing:.12em}
  .stopbtn:hover{border-color:var(--accent);color:var(--ink)}
  .field{display:flex;align-items:center;gap:9px}
  .field .name{width:46px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-size:10px}
  input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:3px}
  .field .read{width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  .qbtn{font:inherit;font-size:10px;background:transparent;border:1px solid rgba(120,220,255,.22);color:var(--dim);
    border-radius:5px;padding:3px 6px;cursor:pointer}
  .qbtn:hover{border-color:var(--accent);color:var(--ink)}
  .chk{display:flex;align-items:center;gap:8px;color:var(--dim);cursor:pointer;letter-spacing:.06em}
  .chk input{accent-color:var(--accent);width:14px;height:14px;flex:none;cursor:pointer}
  #swatch{width:26px;height:26px;padding:0;border:1px solid rgba(120,220,255,.22);border-radius:6px;background:transparent;cursor:pointer}
  #swatch::-webkit-color-swatch-wrapper{padding:2px}#swatch::-webkit-color-swatch{border:none;border-radius:4px}
  #dice{width:26px;height:26px;display:grid;place-items:center;background:transparent;border:1px solid rgba(120,220,255,.22);
    border-radius:6px;color:var(--dim);cursor:pointer}
  #dice:hover{border-color:var(--accent);color:var(--ink)}#dice svg{width:13px;height:13px}
  .cap{color:var(--dim);font-size:10px;letter-spacing:.04em;opacity:.8}
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div class="ov scan"></div>
<div class="ov vig"></div>

<div class="empty" id="empty">
  <div class="big">looper</div>
  <b id="eggmsg">initializing…</b>
  <small>each loop becomes a square on the tree · one plays at a time</small>
  <input type="file" id="pick" accept="audio/*,.wav,.ogg,.mp3" multiple />
</div>

<div class="hud hidden" id="hud">
  <div class="now"><span>signal &nbsp;<span class="val" id="nowname">—</span></span><button class="stopbtn" id="stop">stop</button></div>
  <div class="field">
    <span class="name">speed</span>
    <button class="qbtn" data-v="-1">÷2</button>
    <input type="range" id="speed" min="-1" max="1" step="0.01" value="0" />
    <button class="qbtn" data-v="1">×2</button>
    <span class="read" id="speedr">100%</span>
  </div>
  <div class="field"><span class="name">random</span><label class="chk"><input type="checkbox" id="rnd"/>rand bpm on new</label></div>
  <div class="field"><span class="name">volume</span><input type="range" id="vol" min="0" max="100" step="1" value="80"/><span class="read" id="volr">80%</span></div>
  <div class="field">
    <span class="name">hue</span>
    <input type="color" id="swatch" value="#22d3e6" aria-label="neon hue"/>
    <button id="dice" aria-label="random hue"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="2.5" y="2.5" width="15" height="15" rx="3"/><circle cx="6.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/>
      <circle cx="13.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.1" fill="currentColor" stroke="none"/>
      <circle cx="6.5" cy="13.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="13.5" cy="13.5" r="1.1" fill="currentColor" stroke="none"/></svg></button>
    <span class="read" id="huer" style="width:auto;flex:1;text-align:right;color:var(--dim)">188°</span>
  </div>
  <div class="cap">left-click a square to (re)trigger · right-click stops · right-click a slider resets</div>
</div>

<script>
(function(){
  const cvs=document.getElementById("scene"),ctx=cvs.getContext("2d"),
    oc=document.createElement("canvas"),octx=oc.getContext("2d"),
    empty=document.getElementById("empty"),eggmsg=document.getElementById("eggmsg"),pick=document.getElementById("pick"),hud=document.getElementById("hud"),
    nowname=document.getElementById("nowname"),speed=document.getElementById("speed"),speedr=document.getElementById("speedr"),
    vol=document.getElementById("vol"),volr=document.getElementById("volr"),swatch=document.getElementById("swatch"),
    huer=document.getElementById("huer"),rnd=document.getElementById("rnd"),root=document.documentElement;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LOOPS=["64-1","75-1","75-2","75-3","75-4","75-5","84-2","88-1","91-1","96-1","96-2",
    "100-1","100-2","104-1","108-1","111-1","111-2","123-1","128-1","128-2","175-1"];
  let W=0,H=0,DPR=1,H_=188,segs=[],squares=[],loops=[],active=null,hover=null,baked=false;
  let ctxA=null,master=null,analyser=null,tb=null,src=null,rate=1;
  let phase=0,loopDur=4,lvl=0,lastTs=0,glitch=0;
  const RMIN=1,RMAX=1.84233,NSTEP=16;

  function neon(h,l,a){return "hsla("+((h%360+360)%360)+",95%,"+l+"%,"+a+")";}
  function rr(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
  function ensureCtx(){
    if(!ctxA){
      try{ctxA=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});}
      catch(e){ctxA=new (window.AudioContext||window.webkitAudioContext)();}
      master=ctxA.createGain();master.gain.value=+vol.value/100;
      analyser=ctxA.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=0.8;
      tb=new Uint8Array(analyser.fftSize);master.connect(analyser);analyser.connect(ctxA.destination);
    }
    return ctxA;
  }
  function ac(){ensureCtx();if(ctxA.state==="suspended")ctxA.resume();return ctxA;}
  function repair(buf,ms){
    const fr=buf.sampleRate,L=Math.max(1,Math.round(fr*ms/1000)),n=buf.length,outN=n-L,ch=buf.numberOfChannels;
    if(outN<=L)return buf;const out=ctxA.createBuffer(ch,outN,fr);
    for(let c=0;c<ch;c++){const s=buf.getChannelData(c),d=out.getChannelData(c);
      for(let i=0;i<outN;i++)d[i]=s[i];
      for(let i=0;i<L;i++){const t=(i+0.5)/L;d[i]=s[i]*Math.sin(Math.PI/2*t)+s[outN+i]*Math.cos(Math.PI/2*t);}}
    return out;
  }
  function ready(){empty.style.display="none";hud.classList.remove("hidden");layout();baked=false;}
  async function autoload(){
    ensureCtx();loops=[];
    for(const nm of LOOPS){
      for(const ext of [".ogg",".wav"]){
        try{const r=await fetch("../loops/"+nm+ext);if(!r.ok)continue;
          loops.push({name:nm,buf:repair(await ctxA.decodeAudioData(await r.arrayBuffer()),2)});break;}catch(e){}
      }
    }
    if(loops.length)ready();else eggmsg.textContent="drop your loops here";
  }
  async function load(files){
    const fs=[...files].filter(f=>/\.(wav|ogg|mp3|m4a|flac)$|audio/i.test(f.name+" "+f.type)).sort((a,b)=>a.name.localeCompare(b.name));
    if(!fs.length)return;ensureCtx();stop();loops=[];
    for(const f of fs){try{loops.push({name:f.name.replace(/\.[^.]+$/,""),buf:repair(await ctxA.decodeAudioData(await f.arrayBuffer()),2)});}catch(e){}}
    if(loops.length)ready();
  }

  function grow(x,y,a,len,d,path,g){
    const ex=x+Math.cos(a)*len, ey=y+Math.sin(a)*len, mx=(x+ex)/2,my=(y+ey)/2,
      perp=a+Math.PI/2, cv=(g()-0.5)*len*0.3, cxp=mx+Math.cos(perp)*cv, cyp=my+Math.sin(perp)*cv, idx=segs.length;
    const npath=path.concat(idx);
    segs.push({x1:x,y1:y,cx:cxp,cy:cyp,x2:ex,y2:ey,lvl:d,path:npath});
    if(d>=4)return;const sp=0.6-d*0.05;
    grow(ex,ey,a-sp+(g()-0.5)*0.16,len*(0.7+g()*0.05),d+1,npath,g);
    grow(ex,ey,a+sp+(g()-0.5)*0.16,len*(0.7+g()*0.05),d+1,npath,g);
  }
  function layout(){
    segs=[];squares=[];const N=loops.length;if(!N)return;
    const g=rr(4242),rootX=W/2,rootY=H*0.07,len0=Math.min(H*0.16,175);
    grow(rootX,rootY,Math.PI/2,len0,0,[],g);
    const cand=[];
    for(const s of segs)if(s.lvl>=2)cand.push({x:s.x2,y:s.y2,depth:s.lvl,path:s.path});
    for(let k=cand.length-1;k>0;k--){const j=Math.floor(g()*(k+1));const t=cand[k];cand[k]=cand[j];cand[j]=t;}
    const base=Math.max(21,Math.min(40,Math.min(W,H)*0.03)),chosen=[];
    for(let relax=0.82;chosen.length<N&&relax>0.28;relax-=0.16){
      for(const c of cand){
        if(chosen.length>=N)break;
        if(chosen.some(o=>o.x===c.x&&o.y===c.y))continue;
        const sz=base*(0.78+g()*0.5)*(1-Math.min(0.22,c.depth*0.04));
        let ok=true;for(const o of chosen){if(Math.hypot(o.x-c.x,o.y-c.y)<(o.size+sz)*relax){ok=false;break;}}
        if(ok)chosen.push({x:c.x,y:c.y,size:sz,path:c.path,rot:(g()-0.5)*0.5,hueShift:0});
      }
    }
    squares=chosen.slice(0,N).map((s,i)=>Object.assign(s,{i,name:loops[i].name}));
  }

  function stroke(c,seg,w,col){
    c.beginPath();const st=10;
    for(let i=0;i<=st;i++){const t=i/st,mt=1-t;
      const px=mt*mt*seg.x1+2*mt*t*seg.cx+t*t*seg.x2, py=mt*mt*seg.y1+2*mt*t*seg.cy+t*t*seg.y2;
      i?c.lineTo(px,py):c.moveTo(px,py);}
    c.lineWidth=w;c.strokeStyle=col;c.shadowColor=col;c.shadowBlur=w*3;c.stroke();
  }
  function drawSegs(c,idxs,inten){
    c.globalCompositeOperation="lighter";c.lineCap="round";
    for(const k of idxs){const s=segs[k],w=Math.max(1,3-s.lvl*0.55);
      stroke(c,s,w,neon(H_,56,0.15*inten));stroke(c,s,w*0.5,neon(H_,72,0.4*inten));}
    c.shadowBlur=0;c.globalCompositeOperation="source-over";
  }
  function drawSquare(c,sq,inten,pulse){
    const h=sq.size/2*(pulse||1),hue=H_+sq.hueShift;
    c.save();c.translate(sq.x,sq.y);c.rotate(sq.rot);c.globalCompositeOperation="lighter";
    c.shadowColor=neon(hue,60,1);c.shadowBlur=8+18*inten;
    c.lineWidth=1.6;c.strokeStyle=neon(hue,66,0.5+0.5*inten);c.fillStyle=neon(hue,55,0.05+0.28*inten);
    c.beginPath();c.rect(-h,-h,h*2,h*2);c.fill();c.stroke();
    c.shadowBlur=0;c.fillStyle=neon(hue,86,0.4+0.6*inten);const cc=2+3*inten;c.fillRect(-cc/2,-cc/2,cc,cc);
    c.globalCompositeOperation="source-over";c.restore();
  }
  function bake(){
    octx.setTransform(DPR,0,0,DPR,0,0);octx.clearRect(0,0,W,H);
    drawSegs(octx,segs.map((_,k)=>k),0.5);
    for(const sq of squares)drawSquare(octx,sq,0.12,1);
    baked=true;
  }

  const fog=[{x:.32,y:.4,r:.5,s:.05,ph:0},{x:.68,y:.55,r:.58,s:.037,ph:2},{x:.5,y:.7,r:.44,s:.06,ph:4}];
  function drawFog(ts){
    ctx.globalCompositeOperation="lighter";
    for(const f of fog){
      const dx=(f.x+Math.sin(ts*0.00006*f.s*20+f.ph)*0.06)*W, dy=(f.y+Math.cos(ts*0.00005*f.s*20+f.ph)*0.05)*H, R=f.r*Math.min(W,H);
      const gr=ctx.createRadialGradient(dx,dy,0,dx,dy,R);
      gr.addColorStop(0,neon(H_,30,0.05));gr.addColorStop(1,neon(H_,30,0));
      ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    }
    ctx.globalCompositeOperation="source-over";
  }
  function drawStepRing(sq){
    const cur=Math.floor(phase*NSTEP),R=sq.size*1.5,hue=H_+sq.hueShift;
    ctx.globalCompositeOperation="lighter";
    for(let s=0;s<NSTEP;s++){
      const a=-Math.PI/2+s*2*Math.PI/NSTEP,x=sq.x+Math.cos(a)*R,y=sq.y+Math.sin(a)*R,on=s===cur,near=((s-cur+NSTEP)%NSTEP)<=1;
      ctx.beginPath();ctx.arc(x,y,on?2.6:1.3,0,7);
      ctx.fillStyle=neon(hue,on?85:55,on?1:(near?0.5:0.22));ctx.shadowColor=neon(hue,80,1);ctx.shadowBlur=on?10:0;ctx.fill();
    }
    ctx.shadowBlur=0;ctx.globalCompositeOperation="source-over";
  }
  function doGlitch(){
    for(let b=0;b<3;b++){const by=Math.random()*H,bh=5+Math.random()*20,dx=(Math.random()-0.5)*26;
      ctx.drawImage(cvs,0,by*DPR,W*DPR,bh*DPR,dx,by,W,bh);}
    ctx.globalCompositeOperation="lighter";ctx.globalAlpha=0.05;
    ctx.fillStyle="hsl("+((H_+170)%360)+",100%,55%)";ctx.fillRect(0,Math.random()*H,W,3+Math.random()*10);
    ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
  }

  function frame(ts){
    requestAnimationFrame(frame);const dt=lastTs?Math.min(0.05,(ts-lastTs)/1000):0;lastTs=ts;
    let raw=0;
    if(analyser&&src){analyser.getByteTimeDomainData(tb);for(let i=0;i<tb.length;i+=4){const a=Math.abs(tb[i]-128)/128;if(a>raw)raw=a;}}
    lvl+=(raw-lvl)*0.3;if(src){phase+=dt*rate/loopDur;phase%=1;}
    ctx.clearRect(0,0,W,H);drawFog(ts);
    if(!baked&&squares.length)bake();
    if(baked)ctx.drawImage(oc,0,0,W,H);
    if(hover!=null&&squares[hover]&&hover!==active)drawSquare(ctx,squares[hover],0.42,1);
    if(active!=null&&squares[active]){const sq=squares[active];
      drawSegs(ctx,sq.path,0.7+lvl*0.9);drawStepRing(sq);drawSquare(ctx,sq,0.7+lvl*0.6,1+lvl*0.3);}
    if(!reduce){if(glitch>0){glitch--;doGlitch();}else if(Math.random()<0.006)glitch=4+Math.floor(Math.random()*4);}
  }

  function stop(){if(src){try{src.stop();}catch(e){}src=null;}active=null;nowname.textContent="—";}
  function play(i){
    ac();if(src){try{src.stop();}catch(e){}src=null;}
    if(rnd.checked)setRate(RMIN+Math.random()*(RMAX-RMIN));
    const buf=loops[i].buf;loopDur=buf.duration;phase=0;
    const s=ctxA.createBufferSource();s.buffer=buf;s.loop=true;s.playbackRate.value=rate;s.connect(master);s.start();
    src=s;active=i;nowname.textContent=loops[i].name;
  }
  function setRate(r){rate=r;speed.value=Math.log2(r).toFixed(4);speedr.textContent=Math.round(r*100)+"%";
    if(src)src.playbackRate.setTargetAtTime(r,ctxA.currentTime,0.02);}

  function nodeAt(mx,my){for(let i=0;i<squares.length;i++){const s=squares[i],h=s.size/2+8;
    if(Math.abs(mx-s.x)<=h&&Math.abs(my-s.y)<=h)return i;}return null;}
  cvs.addEventListener("mousemove",e=>{hover=nodeAt(e.clientX,e.clientY);cvs.style.cursor=hover!=null?"pointer":"default";});
  cvs.addEventListener("click",e=>{const i=nodeAt(e.clientX,e.clientY);if(i!=null)play(i);else if(!loops.length)pick.click();});
  cvs.addEventListener("contextmenu",e=>{e.preventDefault();stop();});
  document.getElementById("stop").addEventListener("click",stop);

  speed.addEventListener("input",()=>{rate=Math.pow(2,+speed.value);speedr.textContent=Math.round(rate*100)+"%";
    if(src)src.playbackRate.setTargetAtTime(rate,ctxA.currentTime,0.02);});
  document.querySelectorAll(".qbtn").forEach(b=>b.addEventListener("click",()=>{speed.value=b.dataset.v;speed.dispatchEvent(new Event("input"));}));
  vol.addEventListener("input",()=>{volr.textContent=vol.value+"%";if(master)master.gain.setTargetAtTime(+vol.value/100,ctxA.currentTime,0.01);});
  document.querySelectorAll("input[type=range]").forEach(r=>r.addEventListener("contextmenu",e=>{e.preventDefault();r.value=r.defaultValue;r.dispatchEvent(new Event("input"));}));

  function hexHue(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,
    mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return Math.round(h);}
  function hslHex(h,s,l){s/=100;l/=100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r,g,b;h=(h%360+360)%360;
    if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
    const hx=n=>Math.round((n+m)*255).toString(16).padStart(2,"0");return "#"+hx(r)+hx(g)+hx(b);}
  function setHue(h){H_=h;root.style.setProperty("--h",h);root.style.setProperty("--accent","hsl("+h+" 90% 60%)");
    huer.textContent=h+"°";swatch.value=hslHex(h,70,52);baked=false;}
  swatch.addEventListener("input",e=>setHue(hexHue(e.target.value)));
  document.getElementById("dice").addEventListener("click",()=>setHue(Math.floor(Math.random()*360)));

  function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
    for(const c of[cvs,oc]){c.width=W*DPR;c.height=H*DPR;}cvs.style.width=W+"px";cvs.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);octx.setTransform(DPR,0,0,DPR,0,0);layout();baked=false;}
  addEventListener("resize",()=>{clearTimeout(window._rt);window._rt=setTimeout(resize,150);});
  empty.addEventListener("click",()=>pick.click());
  pick.addEventListener("change",e=>load(e.target.files));
  ["dragenter","dragover"].forEach(ev=>addEventListener(ev,e=>e.preventDefault()));
  addEventListener("drop",e=>{e.preventDefault();if(e.dataTransfer.files.length)load(e.dataTransfer.files);});

  const hp=parseInt(new URLSearchParams(location.search).get("hue"),10);
  setHue(isFinite(hp)?((hp%360)+360)%360:188);
  resize();requestAnimationFrame(frame);autoload();
})();
</script>
</body>
</html>
